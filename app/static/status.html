<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>php2shell-scan · státusz</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none"><path d="M8 11l5 5-5 5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="16" y1="22" x2="24" y2="22" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </span>
    php2shell-scan <small>· <span data-t="status"></span></small>
  </div>
  <div class="hgroup">
    <a class="btn" href="/" data-t="back_scanner"></a>
    <div class="seg" id="lang"><button data-lang="hu">HU</button><button data-lang="en">EN</button></div>
    <button class="icon-btn" id="themebtn" title="Theme" aria-label="Theme">◐</button>
  </div>
</header>

<main>
  <section>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="status"></h1>
    <p class="sub" data-t="lead"></p>
  </section>

  <div class="note" id="note" hidden></div>

  <div class="stats" id="tiles"></div>

  <div class="card">
    <h2 class="cardh" data-t="top_targets"></h2>
    <div id="targets"></div>
  </div>

  <div class="card">
    <h2 class="cardh" data-t="top_ips"></h2>
    <div id="ips"></div>
  </div>

  <div class="card">
    <div class="row">
      <h2 class="cardh" data-t="all_scans"></h2>
      <span class="count" id="scancount"></span>
    </div>
    <div class="toolbar">
      <input type="text" class="filter" id="filter" autocomplete="off">
      <div class="pills" id="pills">
        <button data-f="all" class="on" data-t="f_all"></button>
        <button data-f="hits" data-t="f_hits"></button>
        <button data-f="critical" data-t="f_critical"></button>
      </div>
    </div>
    <div id="scans"></div>
  </div>
</main>

<script src="status.js"></script>
</body>
</html>
